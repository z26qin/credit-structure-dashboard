[project]
name = "creditdash"
version = "0.1.0"
description = "Ticker in, credit-structure dashboard out: SEC filings, a debt-footnote extraction and a fixed template."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "lxml>=5.3",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
creditdash = "creditdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creditdash"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
