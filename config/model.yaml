# Model settings (spec §3.7). Money is in $ millions throughout.
stress_haircut: 0.30   # stress scenario: base EBITDA × (1 − haircut) from FY+1
horizon_years: 10      # last modeled fiscal year = min(latest maturity, FY + horizon)
ipf_max_rounds: 50     # rounds for fitting amortizing loans to the reported maturity schedule
recovery_rate: 0.40    # assumed recovery for market-implied default probability
